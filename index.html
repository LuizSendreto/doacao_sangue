<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de captação de dados para a doação de sangue</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>
        <nav>
            <h2> <strong>Cadastro para doadores de Sangue</strong><h2>

        </nav>
    </header>

    <main>
        <h3 class="bonito"> <strong>Responda esse Formulario para doar seu sangue </strong></h3>

        <form id="formDoacao">

            <input type="text" id="nome" placeholder="Digite seu Nome">
            <br>

            <input type="text" id="email" placeholder="Digite seu email">
            <br>

            <input type="number" id="idade" placeholder="Sua idade">
            <br>

            <select name="tipo" id="sanguineo">

                <option value="">Selecione seu tipo sanguineo</option>
                <option value="">A+</option>
                <option value="">A-</option>
                <option value="">B+</option>
                <option value="">B-</option>
                <option value="">AB+</option>
                <option value="">AB-</option>
                <option value="">O+</option>
                <option value="">O-</option>

            </select>

            <br>

            <input type="number" id="peso" placeholder="Seu Peso">
            <br>

            <input type="text" id="telefone" placeholder="Digite seu telefone">
            <br>

            <select name="text" id="Estado">
                <option value="">Selecione o Estado</option>
                <option value="ac">Acre (AC)</option>
                <option value="al">Alagoas (AL)</option>
                <option value="ap">Amapá (AP)</option>
                <option value="am">Amazonas (AM)</option>
                <option value="ba">Bahia (BA)</option>
                <option value="ce">Ceará (CE)</option>
                <option value="df">Distrito Federal (DF)</option>
                <option value="es">Espírito Santo (ES)</option>
                <option value="go">Goiás (GO)</option>
                <option value="ma">Maranhão (MA)</option>
                <option value="mt">Mato Grosso (MT)</option>
                <option value="ms">Mato Grosso do Sul (MS)</option>
                <option value="mg">Minas Gerais (MG)</option>
                <option value="pa">Pará (PA)</option>
                <option value="pb">Paraíba (PB)</option>
                <option value="pr">Paraná (PR)</option>
                <option value="pe">Pernambuco (PE)</option>
                <option value="pi">Piauí (PI)</option>
                <option value="rj">Rio de Janeiro (RJ)</option>
                <option value="rn">Rio Grande do Norte (RN)</option>
                <option value="rs">Rio Grande do Sul (RS)</option>
                <option value="ro">Rondônia (RO)</option>
                <option value="rr">Roraima (RR)</option>
                <option value="sc">Santa Catarina (SC)</option>
                <option value="sp">São Paulo (SP)</option>
                <option value="se">Sergipe (SE)</option>
                <option value="to">Tocantins (TO)</option>
            </select>
                
            <br>

            <input type="text" id="cidade" placeholder="Digite sua cidade">
            <br>

            <button id="button" type="submit">Enviar</button>

        </form>

        
        <h3 class="bonito"> Compatbilidade de tipos sanguineos </h3>
        <img class="icon"src="assets/tabela-doacao-tipos-sanguineos.jpg" alt="tabela">

    </main>

    <script src="script.js"></script>
</body>

</html>
